
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | FoodBridge</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: var(--cream);
            display: flex;
            flex-direction: column;
        }

        .register-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 45px 15px;
        }

        .register-card {
            width: 100%;
            max-width: 540px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 45px rgba(23,76,53,0.09);
        }

        .register-icon {
            width: 65px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            background: #e0f0e3;
            color: var(--primary);
            border-radius: 18px;
            font-size: 30px;
        }

        .register-card h2 {
            font-family: 'Playfair Display', serif;
            font-weight: 800;
            color: var(--primary);
        }

        .form-label {
            font-weight: 700;
            color: var(--dark);
        }

        .form-control, .form-select {
            padding: 12px;
            border-radius: 9px;
            border: 1px solid #dce5dd;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(112,183,126,0.15);
        }

        .register-submit {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: var(--primary);
            color: white;
            font-weight: 700;
        }

        .register-submit:hover {
            background: var(--secondary);
        }

        .register-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .back-home {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
        }

        @media(max-width: 576px) {
            .register-card {
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>

<nav class="navbar">
    <div class="container">
        <a class="navbar-brand" href="../index.html">
            <i class="bi bi-leaf-fill"></i> FoodBridge
        </a>
        <a href="../index.html" class="back-home">
            <i class="bi bi-arrow-left"></i> Home
        </a>
    </div>
</nav>

<main class="register-wrapper">
    <div class="register-card">

        <div class="text-center">
            <div class="register-icon">
                <i class="bi bi-person-plus-fill"></i>
            </div>

            <h2>Join FoodBridge</h2>
            <p class="text-muted mt-2">
                Create an account and become part of the change.
            </p>
        </div>

        <div id="message" class="mt-3" aria-live="polite"></div>

        <form id="registerForm" class="mt-4">

            <div class="mb-3">
                <label for="full_name" class="form-label">Full Name</label>
                <input
                    type="text"
                    class="form-control"
                    id="full_name"
                    placeholder="Enter your full name"
                    required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input
                    type="email"
                    class="form-control"
                    id="email"
                    placeholder="Enter your email"
                    required>
            </div>

            <div class="mb-3">
                <label for="phone" class="form-label">Phone Number</label>
                <input
                    type="tel"
                    class="form-control"
                    id="phone"
                    placeholder="Enter your phone number"
                    required>
            </div>

            <div class="mb-3">
                <label for="role" class="form-label">Register As</label>
                <select class="form-select" id="role" required>
                    <option value="">Select your role</option>
                    <option value="DONOR">Food Donor</option>
                    <option value="NGO">NGO</option>
                    <option value="VOLUNTEER">Volunteer</option>
                </select>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <input
                    type="password"
                    class="form-control"
                    id="password"
                    placeholder="Create a password"
                    required>
            </div>

            <button type="submit" class="register-submit" id="registerButton">
                Create Account <i class="bi bi-arrow-right"></i>
            </button>

        </form>

        <p class="text-center mt-4 mb-0">
            Already have an account?
            <a href="login.html" class="fw-bold text-decoration-none" style="color: var(--primary);">
                Login
            </a>
        </p>

        <p class="text-center mt-3 mb-0">
            <small class="text-muted">
                Your account will remain pending until admin approval.
            </small>
        </p>

    </div>
</main>

<footer class="footer text-center">
    <div class="container">
        <p class="mb-0">
            © <span id="currentYear"></span> FoodBridge. All rights reserved.
        </p>
    </div>
</footer>

<script src="../js/register.js"></script>

</body>
</html>
