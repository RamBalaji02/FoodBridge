
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor Profile | FoodBridge</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark" style="background:#174c35;">
        <div class="container">
            <a class="navbar-brand fw-bold" href="donor-dashboard.html">
                FoodBridge
            </a>
            <a href="donor-dashboard.html" class="btn btn-outline-light">
                <i class="bi bi-arrow-left"></i> Dashboard
            </a>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm border-0 p-4">
                    <h2 class="mb-2">Donor Profile</h2>
                    <p class="text-muted">
                        Complete your organization details before creating donations.
                    </p>

                    <div id="message"></div>

                    <form id="donorProfileForm">
                        <div class="mb-3">
                            <label class="form-label">Organization Name</label>
                            <input type="text" id="organization_name" class="form-control" required maxlength="200">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Donor Type</label>
                            <select id="donor_type" class="form-select" required>
                                <option value="">Select donor type</option>
                                <option value="RESTAURANT">Restaurant</option>
                                <option value="HOTEL">Hotel</option>
                                <option value="INDIVIDUAL">Individual</option>
                                <option value="SUPERMARKET">Supermarket</option>
                                <option value="OTHER">Other</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">License Number (Optional)</label>
                            <input type="text" id="license_number" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Address</label>
                            <textarea id="address" class="form-control" rows="2" required></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">City</label>
                            <input type="text" id="city" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">State</label>
                            <input type="text" id="state" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Postal Code</label>
                            <input type="text" id="postal_code" class="form-control" required>
                        </div>

                        <button type="submit" id="saveButton" class="btn btn-success w-100">
                            Save Donor Profile
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="../js/donor-profile.js"></script>
</body>
</html>
